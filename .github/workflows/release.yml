name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write # create the GitHub release and upload the archive
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # write the build provenance attestation
      artifact-metadata: write # create the artifact storage record
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Verify architecture
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Derive version
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not a semantic version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint and type-check
        run: make lint
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'run make lint and commit changes'
            exit 1
          fi
      - name: Test
        run: make test
      - name: Build
        run: make build VERSION="$GITHUB_REF_NAME"
      - name: Smoke test binary
        run: |
          test "$(./bin/mlx-spy --version)" = "$GITHUB_REF_NAME"
          ./bin/mlx-spy --help >/dev/null
      - name: Build release archive
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="$(mktemp -d)"
          cp bin/mlx-spy LICENSE "$stage/"
          tar -C "$stage" -czf dist/mlx-spy_darwin_arm64.tar.gz mlx-spy LICENSE
          rm -rf "$stage"
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 mlx-spy_darwin_arm64.tar.gz > mlx-spy_checksums.txt
          cat mlx-spy_checksums.txt
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/mlx-spy_checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*
