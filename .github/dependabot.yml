version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    cooldown:
      default-days: 1
    versioning-strategy: increase
    groups:
      dev:
        patterns:
          - "*"
