<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mlx-spy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%2310b981'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="wordmark"><span class="mark"></span>mlx-spy</div>
        <div class="engine"><span class="dot" id="engine-dot"></span><span id="engine-url"></span></div>
        <div class="seg" id="ranges">
          <button type="button" data-range="1h" class="active">1h</button>
          <button type="button" data-range="6h">6h</button>
          <button type="button" data-range="24h">24h</button>
          <button type="button" data-range="7d">7d</button>
        </div>
      </header>

      <div class="shead"><h2>Live metrics</h2><span class="pill" id="ws-state">connecting</span></div>
      <section class="card">
        <div class="tiles">
          <div class="tile">
            <div class="lbl">Decode</div>
            <div class="val"><span id="t-decode">0</span><span class="unit">tok/s</span></div>
            <div class="sub" id="t-decode-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Prefill</div>
            <div class="val"><span id="t-prefill">0</span><span class="unit">tok/s</span></div>
            <div class="sub" id="t-prefill-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Requests</div>
            <div class="val"><span id="t-requests">0</span><span class="unit">running</span></div>
            <div class="sub" id="t-requests-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Generated</div>
            <div class="val"><span id="t-generated">0</span><span class="unit">tok</span></div>
            <div class="sub" id="t-generated-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">GPU</div>
            <div class="val"><span id="t-gpu">0</span><span class="unit">%</span></div>
            <div class="bar"><div class="fill" id="t-gpu-bar"></div></div>
          </div>
          <div class="tile">
            <div class="lbl">Memory</div>
            <div class="val"><span id="t-mem">-</span><span class="unit">GB</span></div>
            <div class="bar"><div class="fill" id="t-mem-bar"></div></div>
            <div class="sub" id="t-mem-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Prefix cache</div>
            <div class="val"><span id="t-cache">-</span><span class="unit">GB est.</span></div>
            <div class="sub" id="t-cache-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Resident</div>
            <div class="val"><span id="t-resident">0</span><span class="unit">models</span></div>
            <div class="sub" id="t-resident-sub"></div>
          </div>
        </div>
        <div class="sparks two">
          <div class="spark" id="c-decode"><div class="shd"><span class="lbl">Decode tok/s</span><span class="chips"></span></div><div class="plot"></div></div>
          <div class="spark" id="c-prefill"><div class="shd"><span class="lbl">Prefill tok/s</span><span class="chips"></span></div><div class="plot"></div></div>
        </div>
      </section>

      <div class="shead"><h2>Memory</h2></div>
      <section class="card">
        <div class="sparks">
          <div class="spark tall" id="c-memory"><div class="shd"><span class="lbl">Engine process and host</span><span class="chips"></span></div><div class="plot"></div></div>
        </div>
      </section>

      <div class="shead"><h2>Cache, GPU and queue</h2></div>
      <section class="card">
        <div class="sparks three">
          <div class="spark" id="c-cache"><div class="shd"><span class="lbl">Prefix cache</span><span class="chips"></span></div><div class="plot"></div></div>
          <div class="spark" id="c-gpu"><div class="shd"><span class="lbl">GPU</span><span class="chips"></span></div><div class="plot"></div></div>
          <div class="spark" id="c-requests"><div class="shd"><span class="lbl">Requests</span><span class="chips"></span></div><div class="plot"></div></div>
        </div>
      </section>

      <div class="shead">
        <h2>Models</h2>
        <span class="hint" id="disk-note"></span>
        <span class="grow"></span>
        <span class="btns">
          <button type="button" class="btn" id="a-free" data-action="free">Free RAM</button>
          <button type="button" class="btn" id="a-disk" data-action="diskClear">Clear disk cache</button>
        </span>
      </div>
      <section class="card models">
        <table id="models"><tbody></tbody></table>
      </section>
      <div class="event" id="event" hidden></div>

      <footer><span id="version"></span></footer>
    </div>
    <dialog id="confirm">
      <form method="dialog">
        <p id="confirm-text"></p>
        <div class="row">
          <button type="submit" value="cancel" class="btn">Cancel</button>
          <button type="submit" value="ok" class="btn primary" id="confirm-ok">Confirm</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
