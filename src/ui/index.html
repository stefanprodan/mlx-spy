<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mlx-spy</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot" id="engine-dot"></span>
        <strong>mlx-spy</strong>
        <span class="muted" id="engine-url"></span>
      </div>
      <div class="ranges" id="ranges">
        <button type="button" data-range="1h" class="active">1h</button>
        <button type="button" data-range="6h">6h</button>
        <button type="button" data-range="24h">24h</button>
        <button type="button" data-range="7d">7d</button>
      </div>
    </header>

    <section class="tiles" id="tiles">
      <div class="tile"><div class="label">decode</div><div class="value"><span id="t-decode">-</span><span class="unit">tok/s</span></div></div>
      <div class="tile"><div class="label">prefill</div><div class="value"><span id="t-prefill">-</span><span class="unit">tok/s</span></div></div>
      <div class="tile"><div class="label">requests</div><div class="value"><span id="t-requests">-</span><span class="unit" id="t-requests-sub"></span></div></div>
      <div class="tile"><div class="label">ttft</div><div class="value"><span id="t-ttft">-</span><span class="unit">s</span></div></div>
      <div class="tile"><div class="label">cache hit</div><div class="value"><span id="t-cache">-</span><span class="unit">%</span></div></div>
      <div class="tile"><div class="label">gpu</div><div class="value"><span id="t-gpu">-</span><span class="unit">%</span></div></div>
      <div class="tile"><div class="label">memory</div><div class="value"><span id="t-mem">-</span><span class="unit">GB</span></div><div class="sub" id="t-mem-sub"></div></div>
      <div class="tile"><div class="label">generated</div><div class="value"><span id="t-generated">-</span><span class="unit">tok</span></div></div>
    </section>

    <section class="charts">
      <div class="chart" id="c-tokens"><h2>tokens / s</h2></div>
      <div class="chart" id="c-cache"><h2>cache</h2></div>
      <div class="chart" id="c-memory"><h2>memory</h2></div>
      <div class="chart" id="c-gpu"><h2>gpu</h2></div>
      <div class="chart" id="c-requests"><h2>requests</h2></div>
    </section>

    <section class="panel">
      <h2>models</h2>
      <table id="models">
        <thead>
          <tr><th>model</th><th>state</th><th class="num">weights</th><th class="num">on disk</th><th class="num">context</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="muted" id="disk-note"></div>
    </section>

    <footer class="muted"><span id="version"></span> · <span id="ws-state">connecting</span></footer>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
