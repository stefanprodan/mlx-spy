<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mlx-spy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%2310b981'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <div class="wordmark"><span class="mark"></span>mlx-spy</div>
        <span class="grow"></span>
        <div class="seg" id="ranges">
          <button type="button" data-range="1h" class="active">1h</button>
          <button type="button" data-range="6h">6h</button>
          <button type="button" data-range="24h">24h</button>
          <button type="button" data-range="7d">7d</button>
        </div>
      </header>

      <div class="shead">
        <h2>Stats</h2>
        <span class="pill" id="ws-state">connecting</span>
        <span class="grow"></span>
        <span class="btns">
          <button type="button" class="btn" id="a-history" data-action="historyClear">Clear history</button>
        </span>
      </div>
      <section class="card">
        <div class="tiles">
          <div class="tile">
            <div class="lbl">Decode</div>
            <div class="val"><span id="t-decode">0</span><span class="unit">tok/s</span></div>
            <div class="sub" id="t-decode-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Prefill</div>
            <div class="val"><span id="t-prefill">0</span><span class="unit">tok/s</span></div>
            <div class="sub" id="t-prefill-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Requests</div>
            <div class="val"><span id="t-requests">0</span><span class="unit">running</span></div>
            <div class="sub" id="t-requests-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Generated</div>
            <div class="val"><span id="t-generated">0</span><span class="unit">tok</span></div>
            <div class="sub" id="t-generated-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Cache efficiency</div>
            <div class="val"><span id="t-eff">-</span><span class="unit">% reused</span></div>
            <div class="bar"><div class="fill" id="t-eff-bar"></div></div>
            <div class="sub" id="t-eff-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Memory</div>
            <div class="val"><span id="t-mem">-</span><span class="unit">GB</span></div>
            <div class="bar"><div class="fill" id="t-mem-bar"></div></div>
            <div class="sub" id="t-mem-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">Hot cache</div>
            <div class="val"><span id="t-cache">-</span><span class="unit">GB est.</span></div>
            <div class="bar" id="t-cache-track" hidden><div class="fill" id="t-cache-bar"></div></div>
            <div class="sub" id="t-cache-sub"></div>
          </div>
          <div class="tile">
            <div class="lbl">SSD cache</div>
            <div class="val"><span id="t-ssd">-</span><span class="unit">GB</span></div>
            <div class="bar" id="t-ssd-track" hidden><div class="fill" id="t-ssd-bar"></div></div>
            <div class="sub" id="t-ssd-sub"></div>
          </div>
        </div>
        <div class="sparks two">
          <div class="spark" id="c-decode"><div class="shd"><span class="lbl">Decode</span><span class="chips"></span></div><div class="plot"></div></div>
          <div class="spark" id="c-prefill"><div class="shd"><span class="lbl">Prefill</span><span class="chips"></span></div><div class="plot"></div></div>
        </div>
      </section>

      <div class="shead">
        <h2>Models</h2>
        <span class="pill" id="models-phase">idle</span>
        <span class="hint" id="models-activity"></span>
      </div>
      <section class="card models">
        <table id="models"><tbody></tbody></table>
      </section>
      <div class="event" id="event" hidden></div>

      <div class="shead">
        <h2>Runtime</h2>
        <span class="pill" id="engine-state">connecting</span>
        <span class="hint" id="host-note"></span>
        <span class="grow"></span>
        <span class="btns">
          <button type="button" class="btn" id="a-free" data-action="free">Restart engine</button>
        </span>
      </div>
      <section class="card">
        <div class="facts">
          <dl>
            <dt>Engine</dt><dd><span id="engine-name"></span><small id="engine-proc"></small></dd>
            <dt>URL</dt><dd class="mono" id="engine-url"></dd>
            <dt>Weights</dt><dd id="engine-weights"></dd>
            <dt>Memory</dt><dd id="engine-mem"></dd>
            <dt>CPU</dt><dd id="engine-cpu"></dd>
            <dt>GPU</dt><dd id="engine-gpu"></dd>
          </dl>
          <dl>
            <dt>Host</dt><dd id="host-name"></dd>
            <dt>OS</dt><dd id="host-os"></dd>
            <dt>Chip</dt><dd id="host-chip"></dd>
            <dt>GPU</dt><dd id="host-gpu"></dd>
            <dt>Memory</dt><dd id="host-mem"></dd>
            <dt>Disk</dt><dd id="host-disk"></dd>
          </dl>
        </div>
      </section>

      <footer><span id="version"></span></footer>
    </div>
    <dialog id="confirm">
      <form method="dialog">
        <p id="confirm-text"></p>
        <label class="opt" id="confirm-opt" for="confirm-check" hidden>
          <input type="checkbox" id="confirm-check" />
          <span>Delete <span id="confirm-opt-size"></span> of SSD cache</span>
        </label>
        <div class="row">
          <button type="submit" value="cancel" class="btn">Cancel</button>
          <button type="submit" value="ok" class="btn primary" id="confirm-ok">Confirm</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
